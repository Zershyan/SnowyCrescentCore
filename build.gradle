//file:noinspection GroovyAssignabilityCheck
buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
// 包内版本号恒带 +build.<编号>，只有 buildAlpha 会把这个编号也写进 jar 文件名
def isAlphaBuild = gradle.startParameter.taskNames.any { it.endsWith('buildAlpha') }
def baseVersion = "${mod_version}-${minecraft_version}"
version = "${baseVersion}+build.${mod_build_number}"

base {
    archivesName = mod_id
}

java {
    withSourcesJar()
    withJavadocJar()
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory(file('run'))

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        var client = client {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
        }

        client_0 {
            parent(client)
            args("--username", "player_0")
        }

        client_1 {
            parent(client)
            args("--username", "player_1")
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory(file('run-data'))
            property('gradle.task', 'runData')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    flatDir {
        dir 'libs'
    }
    maven { // TOP
        url "https://cursemaven.com"
    }
    maven { //mirror
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name "KosmX's maven"
        url 'https://maven.kosmx.dev/'
    }
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        url "https://maven.blamejared.com"
    }
}

jarJar.enable()

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly 'org.spongepowered:mixin:0.8.5'
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1") {
        jarJar.ranged(it, "[0.4.1,)")
    })

    //Patchouli
    compileOnly fg.deobf("vazkii.patchouli:Patchouli:1.20.1-85-FORGE")

    //JEI
    implementation fg.deobf("curse.maven:jei-238222:6600311")

    //player animator
    implementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:1.0.2-rc1+1.20")
    implementation fg.deobf("io.github.kosmx.bendy-lib:bendy-lib-forge:4.0.0")

    if(!project.gradle.startParameter.taskNames.any { "runServer" in it }) {
        runtimeOnly fg.deobf("curse.maven:freecam-by-zergatul-618947:5402097")
        runtimeOnly fg.deobf("curse.maven:jade-324717:6855440")
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            mod_credits: mod_credits,
            mod_url: mod_url,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "MixinConfigs"            : "${mod_id}.mixins.json"
        ])
    }

    archiveFileName = "${mod_id}-${mod_version}-origin.jar"
    finalizedBy 'reobfJar'
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('Xdoclint:-missing', '-quiet')
    options.encoding = 'UTF-8'
    failOnError = false
}

tasks.register('deobfJar', Jar) {
    from(sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "MixinConfigs"            : "${mod_id}.mixins.json"
        ])
    }
    dependsOn classes
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact deobfJar
            artifact javadocJar
            artifact sourcesJar

            groupId = project.group
            artifactId = mod_id
            version = project.version
            pom {
                name = mod_id
                description = mod_description
                url = mod_url
                licenses {
                    license {
                        name = mod_license
                    }
                }
                developers {
                    developer {
                        id = "{mod_id}"
                        name = mod_authors
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'LTDNexus'
            url = 'https://nexus.bot.leisuretimedock.top/repository/maven-releases/'
            credentials {
                username = System.getenv('LTDNexusUsername') ?: ''
                password = System.getenv('LTDNexusPassword') ?: ''
            }
        }
        maven {
            name = 'MafuyuNexus'
            url = 'https://maven.sighs.cc/repository/maven-releases/'
            credentials {
                username = System.getenv('MafuyuNexusUsername') ?: ''
                password = System.getenv('MafuyuNexusPassword') ?: ''
            }
        }
    }
}

// 与 build 完全相同，只是版本号会带上 +build.<编号>
tasks.register('buildAlpha') {
    group = 'build'
    description = '打成 alpha 包，产物版本号带 +build.<编号>'
    dependsOn 'build'
}

// 打包收尾：jarJar 的 -all 产物改名成最终包，原包挪进 libs/origin；发布用的辅助包不留存
import java.nio.file.Files
import java.nio.file.StandardCopyOption

tasks.register('finalizeArtifacts') {
    group = 'build'
    description = '整理 build/libs：最终包改名到顶层，原包挪进 origin 子目录'
    def libsDir = layout.buildDirectory.dir('libs').get().asFile
    def modId = mod_id
    def modVersion = version
    def releaseVersion = isAlphaBuild ? version : baseVersion
    doLast {
        def fatJar = new File(libsDir, "${modId}-${modVersion}-all.jar")
        def backupJar = new File(new File(libsDir, 'origin'), "${modId}-${modVersion}-all.jar")
        // 最终包由 jarJar 的 -all 产物改名而来；上一轮可能已搬进 origin，就从那里取
        def source = fatJar.exists() ? fatJar : backupJar
        if (source.exists()) {
            Files.copy(source.toPath(), new File(libsDir, "${modId}-${releaseVersion}.jar").toPath(), StandardCopyOption.REPLACE_EXISTING)
            if (source == fatJar) {
                backupJar.parentFile.mkdirs()
                Files.move(fatJar.toPath(), backupJar.toPath(), StandardCopyOption.REPLACE_EXISTING)
            }
        }
        ["${modId}-${modVersion}-javadoc.jar", "${modId}-${modVersion}-sources.jar"].each {
            new File(libsDir, it).delete()
        }
    }
}

tasks.named('build') { finalizedBy 'finalizeArtifacts' }
tasks.named('publishToMavenLocal') { finalizedBy 'finalizeArtifacts' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
