pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

apply plugin: BuildArtifactsCleanupPlugin

import org.gradle.api.flow.*

abstract class BuildArtifactsCleanupPlugin implements Plugin<Settings> {
    @Inject
    protected abstract FlowScope getFlowScope()

    @Inject
    protected abstract FlowProviders getFlowProviders()

    @Override
    void apply(Settings settings) {
        def buildDir = new File(settings.settingsDir, 'build/libs')
        // Read mod_id and mod_version from gradle.properties
        def gradleProps = new Properties()
        def propsFile = new File(settings.settingsDir, 'gradle.properties')
        if (propsFile.exists()) {
            propsFile.withInputStream { gradleProps.load(it) }
        }
        def modId = gradleProps.getProperty('mod_id', 'sccore')
        def modVersion = gradleProps.getProperty('mod_version', '2.0.0-alpha')
        def modBuildNumber = gradleProps.getProperty('mod_build_number', '0')
        modVersion += "+build" + modBuildNumber

        flowScope.always(BuildArtifactsCleanupAction) { spec ->
            spec.parameters.buildWorkResult.set(flowProviders.buildWorkResult)
            spec.parameters.buildDir.set(buildDir)
            spec.parameters.modId.set(modId)
            spec.parameters.modVersion.set(modVersion)
        }
    }
}

abstract class BuildArtifactsCleanupAction implements FlowAction<Parameters> {
    interface Parameters extends FlowParameters {
        @Input
        Property<BuildWorkResult> getBuildWorkResult()

        @Input
        Property<File> getBuildDir()

        @Input
        Property<String> getModId()

        @Input
        Property<String> getModVersion()
    }

    @Override
    void execute(Parameters parameters) {
        def result = parameters.buildWorkResult.get()
        if (result.failure.present) {
            return // Build failed, skip cleanup
        }
        def buildDir = parameters.buildDir.get()
        def modId = parameters.modId.get()
        def modVersion = parameters.modVersion.get()
        def javadocJar = new File(buildDir, "${modId}-${modVersion}-javadoc.jar")
        def sourcesJar = new File(buildDir, "${modId}-${modVersion}-sources.jar")
        if (javadocJar.exists()) javadocJar.delete()
        if (sourcesJar.exists()) sourcesJar.delete()
    }
}

rootProject.name = 'SnowyCrescentCore'
